ls:
  .dir: regex:^([a-z0-9-]+|\.github|\.config)$

  # Rust modules are snake_case; crate directories kebab-case.
  crates:
    .dir: kebab-case
  crates/*/src:
    .dir: snake_case
    .rs: snake_case
  crates/*/tests:
    .rs: snake_case
  crates/*/benches:
    .rs: snake_case

  # The benchmark kit's crates follow the same rules.
  tools/bench/*/src:
    .dir: snake_case
    .rs: snake_case

  # TS bench: one concept per file, specs keep their suffix.
  tools/bench/ts:
    .ts: regex:^[a-z]+(\.spec)?$

ignore:
  - .git
  - .vscode
  - target
  - tmp
  - crates/kb-domain/tests/fixtures
  - tools/bench/fixtures
  - tools/bench/ts/kb
  - tools/bench/ts/node_modules
  - tools/bench/ts/dist
  - .ls-lint.yml
  - .superpowers
  - .delta
