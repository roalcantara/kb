[package]
name = "block"
version = "0.1.6"
authors = ["Steven Sheldon"]

description = "Rust interface for Apple's C language extension of blocks."
keywords = ["blocks", "osx", "ios", "objective-c"]
readme = "README.md"
repository = "http://github.com/SSheldon/rust-block"
documentation = "http://ssheldon.github.io/rust-objc/block/"
license = "MIT"

exclude = [
  ".gitignore",
  ".travis.yml",
  "travis_install.sh",
  "travis_test.sh",
  "tests-ios/**",
]

[dev-dependencies.objc_test_utils]
version = "0.0"
path = "test_utils"

# Patched for kb (crates/third-party/README.md): the 2016 source writes `extern fn` without an ABI,
# which current Rust warns about 46 times. The ABI is "C" either way; silenced here so the source
# keeps its one-line fix only.
[lints.rust]
missing_abi = "allow"
