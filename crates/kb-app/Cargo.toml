[package]
name = "kb-app"
description = "The kb search panel: a resident GPUI Kit app opened by a global hotkey."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "kb"
path = "src/main.rs"


[dependencies]
dirs.workspace = true
futures.workspace = true
global-hotkey.workspace = true
gpui-kit.workspace = true
kb-domain.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
# `cargo packager --release` (mise run package): the .app and .dmg in target/packager.
[package.metadata.packager]
product-name = "kb"
identifier = "dev.roalcantara.kb"
icons = ["assets/icon.icns"]
out-dir = "../../target/packager"
before-packaging-command = "cargo build --release --locked -p kb-app"
binaries = [{ path = "kb", main = true }]
category = "Productivity"
copyright = "© 2026 Rogério Alcântara"

[package.metadata.packager.macos]
# LSUIElement: no Dock icon or app menu, as the resident panel runs (ADR 0004).
background-app = true
minimum-system-version = "13.0"

[lints]
workspace = true
