id: no-process-exit
language: rust
severity: error
message: Only a binary's `main` may end the process; return an error instead.
note: |
  `std::process::exit` skips destructors, so an open SQLite transaction or a GPUI window never
  gets to clean up. Libraries and handlers return `Result` and let `main` decide.
rule:
  any:
    - pattern: std::process::exit($CODE)
    - pattern: process::exit($CODE)
    # `use std::process::exit;` brings the bare name in; flag the import, since a bare `exit(…)`
    # call cannot be told apart from any other function named exit.
    - pattern: use std::process::exit;
    - pattern: use std::process::{$$$ITEMS};
      has:
        kind: identifier
        regex: ^exit$
        stopBy: end
  not:
    inside:
      kind: function_item
      has:
        field: name
        regex: ^main$
      stopBy: end
