[workspace]
resolver = "3"
# The last two are the benchmark kit (tools/bench/README.md): remove them when purging it.
members = ["crates/kb-domain", "crates/kb-app", "tools/bench/kb-bench", "tools/bench/report"]
# Patched third-party crates (crates/third-party/README.md): dependencies, not members, so the workspace lints skip them.
exclude = ["crates/third-party"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
repository = "https://github.com/roalcantara/kb-native"

[workspace.dependencies]
base64 = "0.22"
dirs = "6"
futures = "0.3"
global-hotkey = "0.8"
# The grammars cover every fence language in the corpus (see docs/adr/0005); json and plain text are built in.
gpui-kit = { version = "=0.7.1", features = [
  "tree-sitter",
  "tree-sitter-bash",
  "tree-sitter-javascript",
  "tree-sitter-kotlin",
  "tree-sitter-markdown",
  "tree-sitter-python",
  "tree-sitter-ruby",
  "tree-sitter-sql",
  "tree-sitter-toml",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }
indexmap = "2"
kb-domain = { path = "crates/kb-domain" }
rusqlite = { version = "0.37", features = ["bundled"] }
saphyr = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# block 0.1.6, under GPUI Kit's macOS layers, declares a static of an uninhabited type, which
# future Rust rejects. Its one-line fix, until GPUI Kit moves off it (crates/third-party/README.md).
[patch.crates-io]
block = { path = "crates/third-party/block" }
